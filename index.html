<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tutorcat Desk: tools for tutors on Tutorcat</title>
    <meta name="description" content="A schedule you can drag, blackout times, lesson notes and invoices for tutors on Tutorcat, in English and Arabic. Sign up with the same details as a Tutorcat listing." />
    <!-- Unlisted, like the app: tutors get the link from Tutorcat (also public/robots.txt; no sitemap). -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fcfcf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151f1b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The page colour before the stylesheet loads (same as --background), so it never flashes. -->
    <style>html{background:#fcfcf9}html.dark{background:#151f1b}</style>
    <!-- Before first paint: the saved or system theme and language, shared with the app (app/index.html). -->
    <script>
      (function () {
        var d = document.documentElement, t, l;
        try { t = localStorage.getItem("tutorcat-desk.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") d.classList.add("dark");
        d.style.colorScheme = t;
        l = new URLSearchParams(location.search).get("lang");
        try { l = l || localStorage.getItem("tutorcat-desk.lang"); } catch (e) {}
        if (l === "ar") { d.lang = "ar"; d.dir = "rtl"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"><div class="boot-screen" aria-hidden="true"></div></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
